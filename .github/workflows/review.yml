name: Model Governance Gate (REVIEW)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-gate:
    runs-on: ubuntu-latest

    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" # python 3.11 is not supported by by numpy 2.5.3, which is required by the model gate

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # The REVIEW scenario builds its synthetic data and model inside
      # run_model_gate_review.py (via ci_fixture_gate.make_data), so it no longer
      # depends on the committed X_*.csv files that made it crash.

      - name: Run Model Gate
        id: gate
        run: |
          python run_model_gate_review.py > gate_result.json

          DECISION=$(jq -r '.decision' gate_result.json)
          REASON=$(jq -r '.reason' gate_result.json)

          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT

          echo "Gate decision: $DECISION"

      - name: Upload gate report
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: gate_result.json

  publish-model:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'PASS'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # FIX: this job runs on a fresh runner, so Python and huggingface_hub
      # must be installed here too (previously the script ran without them).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install publish dependencies
        run: pip install huggingface_hub==2.0.0

      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{secrets.HF_TOKEN}}
          HF_REPO_ID: ${{secrets.HF_REPO_ID}}
          # FIX: publish the artifact that was actually gated in this workflow.
          MODEL_FILE: model_params.pkl  # synthetic review model is not saved; this job should never run for REVIEW
        run: |
          python publish_to_huggingface.py

      # Alternative:
      # - name: Register in MLflow
      #   run: python publish_to_mlflow.py

  review-required:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'REVIEW'

    runs-on: ubuntu-latest
    # FIX: creating a branch/PR needs write permissions.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # FIX: create-pull-request only opens a PR when there is a change to
      # commit; previously there was none, so no PR was ever created. Commit
      # the gate report (same approach as gate-fixture.yml).
      - uses: actions/download-artifact@v4
        with:
          name: gate-report
          path: reports/

      # FIX: labels are set here; actions-ecosystem/action-add-labels was
      # removed because it needs a PR/issue event context and fails on push.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "[Model Gate Review] Manual assessment required"
          body: |
            Model Gate decision: REVIEW

            Reason:
            ${{ needs.model-gate.outputs.reason }}

            Governance team should review before release.
          branch: model-gate-review
          commit-message: "Model gate review report"
          add-paths: reports/gate_result.json
          labels: governance-review

  blocked:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'BLOCK'

    runs-on: ubuntu-latest
    # FIX: opening an issue needs issues: write.
    permissions:
      issues: write

    steps:
      - name: Fail Pipeline
        run: |
          echo "MODEL RELEASE BLOCKED"
          echo "${{ needs.model-gate.outputs.reason }}"
          exit 1

      - name: Notify User
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Model Gate Blocked Deployment (REVIEW scenario)',
              body: `
              Deployment blocked by Model Gate.

              Reason:
              ${{ needs.model-gate.outputs.reason }}
              `
            })
