name: Model Governance Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  model-gate:
    runs-on: ubuntu-latest

    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Model Gate
        id: gate
        run: |
          python run_model_gate.py > gate_result.json

          DECISION=$(jq -r '.decision' gate_result.json)
          REASON=$(jq -r '.reason' gate_result.json)

          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT

          echo "Gate decision: $DECISION"

      - name: Upload gate report
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: gate_result.json

  publish-model:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'PASS'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python publish_to_huggingface.py

      # Alternative:
      # - name: Register in MLflow
      #   run: python publish_to_mlflow.py

  review-required:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'REVIEW'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "[Model Gate Review] Manual assessment required"
          body: |
            Model Gate decision: REVIEW

            Reason:
            ${{ needs.model-gate.outputs.reason }}

            Governance team should review before release.
          branch: model-gate-review

      - name: Add review label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: |
            governance-review

  blocked:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'BLOCK'

    runs-on: ubuntu-latest

    steps:
      - name: Fail Pipeline
        run: |
          echo "MODEL RELEASE BLOCKED"
          echo "${{ needs.model-gate.outputs.reason }}"
          exit 1

      - name: Notify User
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Model Gate Blocked Deployment',
              body: `
              Deployment blocked by Model Gate.

              Reason:
              ${{ needs.model-gate.outputs.reason }}
              `
            })