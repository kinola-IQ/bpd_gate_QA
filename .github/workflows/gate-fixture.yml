name: Gate Fixture Test (synthetic)
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which synthetic scenario to run"
        type: choice
        options: [pass, review, block]
        default: pass

permissions:
  contents: read

jobs:
  model-gate:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # same as the main workflows

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run synthetic gate
        id: gate
        run: |
          python ci_fixture_gate.py --scenario "${{ inputs.scenario }}" > gate_result.json
          DECISION=$(jq -r '.decision' gate_result.json)
          REASON=$(jq -r '.reason' gate_result.json)
          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          echo "Gate decision: $DECISION (scenario: ${{ inputs.scenario }})"

      - uses: actions/upload-artifact@v4
        with:
          name: fixture-gate-report
          path: gate_result.json

  fixture-pass:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'PASS'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PASS routed correctly. Synthetic model, NOT publishing."

  fixture-review:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'REVIEW'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # A PR needs something to commit, so bring the report into the repo.
      - uses: actions/download-artifact@v4
        with:
          name: fixture-gate-report
          path: reports/

      - name: Create review PR
        uses: peter-evans/create-pull-request@v7
        with:
          title: "[Fixture] Model Gate REVIEW routing test"
          body: |
            Synthetic fixture test. Decision: REVIEW

            Reason:
            ${{ needs.model-gate.outputs.reason }}
          branch: fixture-gate-review
          commit-message: "Fixture gate review report"
          add-paths: reports/gate_result.json
          labels: governance-review

  fixture-block:
    needs: model-gate
    if: needs.model-gate.outputs.decision == 'BLOCK'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Fixture] Model Gate BLOCK routing test',
              body: `Synthetic fixture test blocked as expected.\n\nReason:\n${{ needs.model-gate.outputs.reason }}`
            })
      - name: Fail pipeline (expected)
        run: |
          echo "MODEL RELEASE BLOCKED (synthetic fixture)"
          exit 1